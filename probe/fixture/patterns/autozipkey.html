<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>郵便番号から住所補完（keyup）</title>
<style>body{font:18px system-ui;max-width:40rem;margin:1rem auto;padding:1rem}label,.row{display:block;margin:.6rem 0}input,select{font:inherit;padding:.35rem;box-sizing:border-box}input.w{display:block;width:100%}.row input{width:5.5rem}button{font:inherit;padding:.6rem}output{display:block;padding:1rem}</style>
<h1>郵便番号から住所補完（keyup）</h1>
<p>ダミー専用。住所補完はページ内の固定表で行い、外部へ通信しません。</p>
<form id="fixture" onsubmit="event.preventDefault()">
<label>お名前<input class="w" name="name"></label>
<div class="row">郵便番号 <input name="zip1" maxlength="3"> - <input name="zip2" maxlength="4"></div>
<label>都道府県<select name="pref"><option value="">選択</option><option>東京都</option><option>神奈川県</option></select></label>
<label>市区町村・番地<input class="w" name="addr1"></label>
<label>建物名<input class="w" name="addr2"></label>
<button type="button" id="verify">入力結果を検証</button>
</form><output id="result">未検証</output>
<script>
// Stand-in for a zip-to-address widget (e.g. ajaxzip3-style), using a fixed local table and an
// artificial delay like a network lookup. Like such widgets, it writes city+town into addr1.
const f = document.querySelector('#fixture');
const table = {'1000001': ['神奈川県', '横浜市中区検証町']};
const lookup = () => {
  const hit = table[f.zip1.value + f.zip2.value];
  if (!hit) return;
  setTimeout(() => {
    f.pref.value = hit[0];
    f.addr1.value = hit[1];
    window.zipFilled = (window.zipFilled || 0) + 1;
  }, 300);
};
const trigger = document.title.includes('keyup') ? 'keyup' : 'input';
f.zip1.addEventListener(trigger, lookup);
f.zip2.addEventListener(trigger, lookup);
window.EXPECTED = {name: '試験 太郎', zip1: '100', zip2: '0001', pref: '神奈川県',
  addr1: '横浜市中区検証町1-2-3', addr2: 'ダミービル101'};
</script><script src="check.js"></script></html>
