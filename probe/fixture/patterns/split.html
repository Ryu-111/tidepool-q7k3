<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>分割入力パターン</title>
<style>body{font:18px system-ui;max-width:40rem;margin:1rem auto;padding:1rem}label{display:block;margin:.6rem 0}input,select{font:inherit;padding:.35rem;box-sizing:border-box}input.w{display:block;width:100%}.row input{width:5.5rem}button{font:inherit;padding:.6rem}output{display:block;padding:1rem}</style>
<h1>分割入力パターン</h1>
<p>ダミー専用。送信機能はありません。</p>
<form id="fixture" onsubmit="event.preventDefault()">
<label>姓<input class="w" name="sei"></label>
<label>名<input class="w" name="mei"></label>
<label>セイ（全角カナ）<input class="w" name="kana_sei"></label>
<label>メイ（全角カナ）<input class="w" name="kana_mei"></label>
<div class="row">郵便番号 <input name="zip1" maxlength="3" inputmode="numeric"> - <input name="zip2" maxlength="4" inputmode="numeric"></div>
<label>都道府県<select name="pref"><option value="">選択してください</option><option value="01">北海道</option><option value="13">東京都</option><option value="14">神奈川県</option><option value="27">大阪府</option></select></label>
<label>市区町村<input class="w" name="city"></label>
<label>番地<input class="w" name="addr"></label>
<label>建物名・部屋番号（任意）<input class="w" name="building"></label>
<div class="row">電話番号 <input name="tel1" maxlength="4" type="tel"> - <input name="tel2" maxlength="4" type="tel"> - <input name="tel3" maxlength="4" type="tel"></div>
<button type="button" id="verify">入力結果を検証</button>
</form><output id="result">未検証</output>
<script>
window.EXPECTED = {sei: '試験', mei: '太郎', kana_sei: 'シケン', kana_mei: 'タロウ', zip1: '100', zip2: '0001',
  pref: '神奈川県', city: '横浜市中区', addr: '検証町1-2-3', building: 'ダミービル101',
  tel1: '090', tel2: '0000', tel3: '0000'};
</script><script src="check.js"></script></html>
