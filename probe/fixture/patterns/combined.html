<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>一括入力パターン</title>
<style>body{font:18px system-ui;max-width:40rem;margin:1rem auto;padding:1rem}label{display:block;margin:.6rem 0}input{display:block;width:100%;font:inherit;padding:.35rem;box-sizing:border-box}button{font:inherit;padding:.6rem}output{display:block;padding:1rem}</style>
<h1>一括入力パターン</h1>
<p>ダミー専用。送信機能はありません。</p>
<form id="fixture" onsubmit="event.preventDefault()">
<label>お名前<input name="name" placeholder="例）山田　太郎"></label>
<label>ふりがな<input name="furigana" placeholder="やまだ たろう"></label>
<label>郵便番号<input name="postal" placeholder="例）100-0001" maxlength="8"></label>
<label>ご住所<input name="address"></label>
<label>電話番号（ハイフンなし）<input name="phone" type="tel" maxlength="11"></label>
<label>メールアドレス<input name="email" type="email"></label>
<label>メールアドレス（確認用）<input name="email_confirm" type="email"></label>
<button type="button" id="verify">入力結果を検証</button>
</form><output id="result">未検証</output>
<script>
window.EXPECTED = {name: '試験　太郎', furigana: 'しけん たろう', postal: '100-0001',
  address: '神奈川県横浜市中区検証町1-2-3 ダミービル101', phone: '09000000000',
  email: 'dummy@example.invalid', email_confirm: 'dummy@example.invalid'};
</script><script src="check.js"></script></html>
