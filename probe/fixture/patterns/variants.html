<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>一括・表記ゆれパターン</title>
<style>body{font:18px system-ui;max-width:40rem;margin:1rem auto;padding:1rem}label{display:block;margin:.6rem 0}input,select{display:block;width:100%;font:inherit;padding:.35rem;box-sizing:border-box}button{font:inherit;padding:.6rem}output{display:block;padding:1rem}</style>
<h1>一括・表記ゆれパターン</h1>
<p>ダミー専用。送信機能はありません。</p>
<form id="fixture" onsubmit="event.preventDefault()">
<label>生年月日（半角数字8桁）<input name="birth" placeholder="YYYYMMDD" maxlength="8"></label>
<label>性別<select name="sex"><option value="">選択してください</option><option value="1">男性</option><option value="2">女性</option><option value="9">その他</option></select></label>
<label>都道府県・市区町村<input name="area"></label>
<label>町名・丁目<input name="town_chome"></label>
<label>番地・号<input name="bango"></label>
<label>建物名・部屋番号<input name="bldg"></label>
<label>誕生日（カレンダー）<input name="bday_native" type="date" aria-label="誕生日"></label>
<label>生年月日（和暦）<input name="birth_wareki" placeholder="例）平成2年4月5日"></label>
<button type="button" id="verify">入力結果を検証</button>
</form><output id="result">未検証</output>
<script>
window.EXPECTED = {birth: '19900405', sex: '女性', area: '神奈川県横浜市中区', town_chome: '検証町1丁目',
  bango: '2-3', bldg: 'ダミービル101', bday_native: '1990-04-05', birth_wareki: '平成2年4月5日'};
</script><script src="check.js"></script></html>
