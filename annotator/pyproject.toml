[project]
name = "jev-annotator"
version = "0.1.0"
description = "Local web app for labelling the field kinds of the real-form corpus"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
jev-annotator = "jev_annotator.__main__:main"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_annotator"]

# --- Ruff: every rule on, then opt out only where a rule conflicts or does not fit. ---
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "ISC001", # conflicts with the formatter
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "D105",   # magic methods document themselves
    "D107",   # __init__ is documented on the class
    "N802",   # do_GET / do_PUT are the http.server API
    "CPY001", # private project, no per-file copyright header
]
# Japanese UI text uses full-width brackets and plus on purpose; other confusables stay errors.
allowed-confusables = ["（", "）", "＋"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # pytest uses assert
    "D",       # test names are the documentation
    "PLR2004", # literal expectations are the point of a test
    "INP001",  # tests are not a package
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-returns = 5
max-statements = 40

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

# --- Mypy: strict plus the optional error codes that strict leaves off. ---
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_any_unimported = true
disallow_any_decorated = true
disallow_any_explicit = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]

[[tool.mypy.overrides]]
module = "tests.*"
# pytest fixtures and parametrize are typed with Any upstream.
disallow_any_decorated = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--cov=jev_annotator", "--cov-branch", "--cov-fail-under=85"]
xfail_strict = true
filterwarnings = ["error"]
